<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | SYC</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #f4f7f3;
        color: #243b32;
        text-align: center;
      }

      .thank-you {
        max-width: 560px;
        padding: 48px 32px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      }

      .check {
        font-size: 52px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 32px;
      }

      p {
        line-height: 1.7;
        color: #617067;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 22px;
        border-radius: 8px;
        background: #28664f;
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        background: #1d4e3c;
      }
    </style>
  </head>
  <body>
    <main class="thank-you">
      <div class="check">✓</div>
      <h1>Thank You!</h1>
      <p>
        Thank you for applying to Sanjeevani &amp; Yoga Club. We appreciate your
        interest in joining our community.
      </p>
      <p>Your details have been submitted successfully.</p>
      <a href="./">Back to Home</a>
    </main>
  </body>
</html>
